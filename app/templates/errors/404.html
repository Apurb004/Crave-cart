{% extends 'base.html' %}

{% block title %}404 Not Found{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 4rem auto; text-align: center;">
  <div class="card" style="padding: 3rem 2rem;">
    <h1 style="font-size: 3.5rem; color: var(--color-accent); margin-bottom: 0.5rem; font-weight: 800;">404</h1>
    <h2 style="font-size: 1.5rem; color: var(--color-primary-dark); margin-bottom: 0.75rem;">Page Not Found</h2>
    <p style="color: var(--color-text-muted); margin-bottom: 2rem;">The dish, order, or page you were looking for could not be found or has moved.</p>
    <a href="{{ url_for('customer.index') }}" class="btn btn-primary">Return to Home</a>
  </div>
</div>
{% endblock %}
