{% extends 'base.html' %}

{% block title %}500 Server Error{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 4rem auto; text-align: center;">
  <div class="card" style="padding: 3rem 2rem;">
    <h1 style="font-size: 3.5rem; color: var(--color-accent); margin-bottom: 0.5rem; font-weight: 800;">500</h1>
    <h2 style="font-size: 1.5rem; color: var(--color-primary-dark); margin-bottom: 0.75rem;">Internal Server Error</h2>
    <p style="color: var(--color-text-muted); margin-bottom: 2rem;">Something went wrong on our end. Our kitchen team is on it! Please try again in a few moments.</p>
    <a href="{{ url_for('customer.index') }}" class="btn btn-primary">Return to Home</a>
  </div>
</div>
{% endblock %}
